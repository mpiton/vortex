name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-checks:
    name: Rust — fmt + clippy + deny + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace -- -D warnings

      - name: Install cargo tooling
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-llvm-cov,cargo-deny

      - name: cargo deny
        run: cargo deny --manifest-path src-tauri/Cargo.toml check

      - name: Tests + coverage
        run: |
          cargo llvm-cov \
            --manifest-path src-tauri/Cargo.toml \
            --workspace \
            --lcov \
            --output-path lcov.info

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: lcov.info

  frontend-checks:
    name: Frontend — oxlint + oxfmt + tsc + knip + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm audit
        run: npm audit

      - name: oxlint
        run: npx oxlint . --max-warnings=0

      - name: oxfmt --check
        run: |
          npx oxfmt --check --ignore-path .oxfmtignore --ignore-path .gitignore \
            'src/**/*.{ts,tsx,css,json}' \
            knip.json package.json tsconfig.json tsconfig.node.json

      - name: tsc -b
        run: npx tsc -b

      - name: knip
        run: npx knip --reporter compact

      - name: vitest + coverage
        run: npx vitest run --coverage --passWithNoTests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: coverage/

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test secrets scanner
        run: ./scripts/test-no-secrets.sh

      - name: Scan tracked files for secrets
        run: ./scripts/no-secrets.sh --all

  forbidden-tools:
    name: Forbidden tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Reject pnpm-lock.yaml / yarn.lock
        run: |
          # Scan every tracked path (not just root) so a nested
          # `tools/yarn.lock` cannot bypass the policy.
          FORBIDDEN_LOCKS=$(git ls-files | grep -E '(^|/)(pnpm-lock\.yaml|yarn\.lock)$' || true)
          if [ -n "$FORBIDDEN_LOCKS" ]; then
            echo "::error::pnpm-lock.yaml / yarn.lock detected:"
            echo "$FORBIDDEN_LOCKS"
            echo "Vortex uses npm only. Remove these files."
            exit 1
          fi

      - name: Reject Biome / ESLint / Prettier configs
        run: |
          # Scan all tracked paths (not just root dotfiles) so flat-config
          # files like `eslint.config.ts` or a nested `packages/foo/biome.json`
          # cannot bypass the policy.
          FORBIDDEN=$(git ls-files | grep -E \
            '(^|/)(\.eslintrc.*|eslint\.config\..+|biome\.json.*|biome\.jsonc.*|\.prettierrc.*|prettier\.config\..+)$' \
            || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden lint/format configs detected:"
            echo "$FORBIDDEN"
            echo "Vortex uses oxlint + oxfmt only."
            exit 1
          fi

      - name: Reject #[allow] / @ts-ignore / oxlint-disable
        run: |
          # Multi-line aware Rust scanner lives in a sibling Python script.
          # `git grep` is line-oriented and would miss split forms like
          #   #[allow(
          #       dead_code,
          #   )]
          # Convention: exit 0 = clean, exit 1 = hits found (output captured),
          # any other status = real failure (Python crash, missing tool, etc).
          # We must distinguish those — a blanket `|| true` would mask real
          # errors and silently let suppressions through.
          BAD_RUST_OUTPUT=$(python3 scripts/forbidden-rust-allow.py 2>&1) \
            || BAD_RUST_STATUS=$?
          BAD_RUST_STATUS=${BAD_RUST_STATUS:-0}
          case "$BAD_RUST_STATUS" in
            0) BAD_RUST="" ;;
            1) BAD_RUST="$BAD_RUST_OUTPUT" ;;
            *)
              echo "::error::scripts/forbidden-rust-allow.py crashed (exit $BAD_RUST_STATUS):"
              echo "$BAD_RUST_OUTPUT"
              exit "$BAD_RUST_STATUS"
              ;;
          esac
          # `git grep` exits non-zero when it finds no match — that is the
          # success path here, so shield the assignment with `|| true` rather
          # than disabling errexit for the whole step.
          BAD_TS=$(git grep -nE '@ts-ignore|@ts-expect-error|oxlint-disable' -- '*.ts' '*.tsx' '*.js' '*.jsx' || true)
          BAD_TS=$(printf '%s\n' "$BAD_TS" | head -20)
          if [ -n "$BAD_RUST" ] || [ -n "$BAD_TS" ]; then
            echo "::error::Error suppression detected (forbidden):"
            [ -n "$BAD_RUST" ] && echo "$BAD_RUST"
            [ -n "$BAD_TS" ] && echo "$BAD_TS"
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: [rust-checks, frontend-checks, secrets-scan, forbidden-tools]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: npm ci
        run: npm ci

      - name: Tauri build
        id: tauri-build
        shell: bash
        run: npx tauri build --config .github/tauri.ci.conf.json 2>&1 | tee tauri-build.log

      - name: Upload Tauri build diagnostics
        if: failure() && steps.tauri-build.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-build-diagnostics-${{ matrix.os }}
          path: tauri-build.log
          if-no-files-found: warn
          retention-days: 7

  changelog-check:
    name: CHANGELOG updated
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md updated when code changes
        run: |
          # Use three-dot range so the diff is computed from the merge-base
          # of base..head, not the endpoint snapshot. Without this, a docs-
          # only PR can be flagged as "code changed" when `main` advances
          # ahead of the branch and unrelated upstream commits appear in
          # the endpoint diff.
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "${BASE}...${HEAD}")
          CODE_CHANGED=$(echo "$CHANGED" | grep -E '\.(rs|ts|tsx|js|jsx)$' || true)
          CHANGELOG_CHANGED=$(echo "$CHANGED" | grep -x 'CHANGELOG.md' || true)
          if [ -n "$CODE_CHANGED" ] && [ -z "$CHANGELOG_CHANGED" ]; then
            echo "::error::Code changed without a CHANGELOG.md entry"
            echo "Add a line in the [Unreleased] section."
            exit 1
          fi
