# cargo-deny config — Vortex
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# === Vulnerability advisories (RustSec) ===
[advisories]
db-path = "$CARGO_HOME/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Transitive advisories firing through Tauri 2.x → wry → libappindicator /
# urlpattern / gtk-rs. None have a safe upgrade today; upstream replacements
# (gtk-rs GTK4, icu4x) require Tauri 3.x. Track for removal once Tauri ships
# GTK4 webkit2gtk-6.0 (tauri-apps/tauri#9777).
ignore = [
  # gtk-rs GTK3 bindings unmaintained — transitive via tauri-runtime-wry
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  # proc-macro-error unmaintained — transitive via tauri macros stack
  "RUSTSEC-2024-0370",
  # bincode is unmaintained in all versions; evaluate a maintained alternative
  # in a dedicated migration batch.
  "RUSTSEC-2025-0141",
  # rust-unic family unmaintained — transitive via urlpattern → tauri-utils
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
  # proc-macro-error2 2.0.1 is unmaintained through sea-bae →
  # sea-orm-macros 1.1.20. It runs only while compiling, so it has no runtime
  # input surface. Mitigation: follow SeaORM 1.x updates and remove this entry
  # when its macros migrate. Review by 2026-10-15.
  "RUSTSEC-2026-0173",
  # quick-xml <0.41 is pulled by wayland-scanner 0.31.10 for trusted build-time
  # protocol XML. The vulnerable parser paths do not process remote XML in
  # Vortex.
  # Mitigation: keep parent crates current and remove when they adopt 0.41+.
  # Review by 2026-10-15.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

# === License compliance (GPL-3.0 compatible) ===
[licenses]
confidence-threshold = 0.8
allow = [
  # Permissive licenses GPL-3.0 compatible
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "0BSD",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CDLA-Permissive-2.0",

  # Vortex itself
  "GPL-3.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
]

# === Bans / duplicates ===
[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = []
skip = []
skip-tree = []

# === Sources ===
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
